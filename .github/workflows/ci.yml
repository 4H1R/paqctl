name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Build check, syntax & ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: paqctl.sh matches src/ (run ./build.sh after editing src/)
        run: bash build.sh --check

      - name: Extract embedded management script
        run: bash tests/extract-management.sh paqctl.sh > "$RUNNER_TEMP/paqctl-mgmt.sh"

      - name: bash -n
        run: |
          bash -n paqctl.sh
          bash -n "$RUNNER_TEMP/paqctl-mgmt.sh"
          for f in build.sh src/*.sh src/*/*.sh; do bash -n "$f"; done

      - name: ShellCheck (errors)
        run: |
          shellcheck --version
          shellcheck -S error paqctl.sh "$RUNNER_TEMP/paqctl-mgmt.sh" build.sh tests/extract-management.sh tests/egress-integration.sh

  test:
    name: CLI tests (bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats

      - name: Run tests
        run: bats tests

  egress:
    name: Egress guard (real kernel, systemd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run egress guard integration test
        run: sudo bash tests/egress-integration.sh
